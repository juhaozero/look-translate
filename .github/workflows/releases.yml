name: Publish App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  changelog:
    name: Generate changelog
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: COMMIT
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>未分类提交</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n---\n\n**Full Changelog**: #{{RELEASE_DIFF}}",
              "commit_template": "- #{{TITLE}}",
              "empty_template": "本版本无变更。",
              "categories": [
                { "title": "## ✨ 新功能", "labels": ["feat", "feature"] },
                { "title": "## 🐛 修复问题", "labels": ["fix"] },
                { "title": "## 🧰 维护更新", "labels": ["chore", "refactor", "build", "ci"] },
                { "title": "## 📝 其他", "labels": ["docs", "style", "test", "perf", "revert"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([\\w\\-\\.]+\\))?(!)?:\\s*(.+)$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build and draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: changelog
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and version consistency
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must be formal semver: vX.Y.Z (got: $tag)"
          }
          $version = $tag.Substring(1)

          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $cargoMatch) { throw "Could not read version from src-tauri/Cargo.toml" }
          $cargo = $cargoMatch.Matches[0].Groups[1].Value

          Write-Host "tag=$version package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"

          if ($pkg -ne $version -or $tauri -ne $version -or $cargo -ne $version) {
            throw "Version mismatch: tag v$version must equal package.json, tauri.conf.json, and Cargo.toml"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Look Translate ${{ github.ref_name }}
          releaseBody: ${{ needs.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi

  build-check:
    name: Build installers (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS and MSI
        run: npm run tauri:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: look-translate-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
